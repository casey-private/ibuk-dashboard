    // 計算兩個日期之間的交易日數 (扣除星期六、日)
    function calcTradingDays(startDateStr, endDateStr) {
      if (!startDateStr) return 0;
      const start = new Date(startDateStr);
      const end = endDateStr ? new Date(endDateStr) : new Date();
      if (isNaN(start.getTime()) || start > end) return 0;

      let count = 0;
      let cur = new Date(start);
      cur.setHours(0, 0, 0, 0);
      const target = new Date(end);
      target.setHours(0, 0, 0, 0);

      while (cur < target) {
        cur.setDate(cur.getDate() + 1);
        const day = cur.getDay();
        if (day !== 0 && day !== 6) {
          count++;
        }
      }
      return Math.max(0, count);
    }

    // 格式化貨幣
    const fmtGBP = (val) => {
      if (val === undefined || val === null || isNaN(val)) return "£0.00";
      return new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(val);
    };

    const fmtNum = (val, decimals = 2) => {
      if (val === undefined || val === null || isNaN(val)) return "0.00";
      return Number(val).toLocaleString('en-GB', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });

    // --- 100% 還原 Excel Data_XXX 工作表的 Wilder's 平滑 RSI 與 MA 計算引擎 ---
    function computeExcelIndicators(closes) {
      if (!closes || closes.length < 16) return null;

      // 1. MA4 與 MA30
      const last4 = closes.slice(-4);
      const ma4 = last4.reduce((a, b) => a + b, 0) / last4.length;
      const last30 = closes.slice(-30);
      const ma30 = last30.reduce((a, b) => a + b, 0) / last30.length;

      // 2. 計算單日漲跌 Gain / Loss
      const gains = [];
      const losses = [];
      for (let i = 1; i < closes.length; i++) {
        const diff = closes[i] - closes[i - 1];
        gains.push(diff > 0 ? diff : 0);
        losses.push(diff < 0 ? Math.abs(diff) : 0);
      }

      // 3. Wilder 平滑 RSI(2)
      let avgGain2 = (gains[0] + gains[1]) / 2;
      let avgLoss2 = (losses[0] + losses[1]) / 2;
      for (let i = 2; i < gains.length; i++) {
        avgGain2 = (avgGain2 * 1 + gains[i]) / 2;
        avgLoss2 = (avgLoss2 * 1 + losses[i]) / 2;
      }
      const rsi2 = avgLoss2 === 0 ? 100 : 100 - (100 / (1 + (avgGain2 / avgLoss2)));

      // 4. Wilder 平滑 RSI(14)
      let avgGain14 = gains.slice(0, 14).reduce((a, b) => a + b, 0) / 14;
      let avgLoss14 = losses.slice(0, 14).reduce((a, b) => a + b, 0) / 14;
      for (let i = 14; i < gains.length; i++) {
        avgGain14 = (avgGain14 * 13 + gains[i]) / 14;
        avgLoss14 = (avgLoss14 * 13 + losses[i]) / 14;
      }
      const rsi14 = avgLoss14 === 0 ? 100 : 100 - (100 / (1 + (avgGain14 / avgLoss14)));

      return {
        latestRawClose: closes[closes.length - 1],
        rsi2: Number(rsi2.toFixed(2)),
        rsi14: Number(rsi14.toFixed(2)),
        ma4: Number(ma4.toFixed(3)),
        ma30: Number(ma30.toFixed(3))
      };
    }

    // --- 透過多節點 CORS Proxy 抓取 Yahoo Finance 歷史日線與即時收市價 ---
    async function fetchYahooChartWithFallback(symbol) {
      const urls = [
        `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?range=3mo&interval=1d`,
        `https://query2.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?range=3mo&interval=1d`
      ];
      const proxies = [
        (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
        (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`,
        (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
      ];

      let lastErr = null;
      for (const targetUrl of urls) {
        for (const buildProxyUrl of proxies) {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 6500);
            const res = await fetch(buildProxyUrl(targetUrl), {
              cache: 'no-store',
              signal: controller.signal
            });
            clearTimeout(timeoutId);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            const result = json?.chart?.result?.[0];
            if (!result) throw new Error('無效報價結構');

            const rawCloses = result.indicators?.quote?.[0]?.close || [];
            const cleanCloses = rawCloses.filter((v) => typeof v === 'number' && !isNaN(v));
            const metaPrice = result.meta?.regularMarketPrice;
            if (typeof metaPrice === 'number' && !isNaN(metaPrice) && cleanCloses.length > 0) {
              cleanCloses[cleanCloses.length - 1] = metaPrice;
            }
            if (cleanCloses.length >= 16) {
              return {
                closes: cleanCloses,
                marketTime: result.meta?.regularMarketTime
              };
            }
          } catch (err) {
            lastErr = err;
          }
        }
      }
      throw lastErr || new Error(`無法獲取 ${symbol} 報價`);
    }

    // --- 手動修改追蹤工具 (獨立儲存於 IBUK_MANUAL_OVERRIDES_V1) ---
    function formatLocalTimestamp(date = new Date()) {
      const pad = (n) => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function hasActiveOverrides(ov) {
      if (!ov || typeof ov !== 'object') return false;
      const hasPos = ov.positions && Object.keys(ov.positions).length > 0;
      const hasPrices = ov.prices && Object.keys(ov.prices).length > 0;
      const hasAvg = ov.avgPrices && Object.keys(ov.avgPrices).length > 0;
      const hasCost = ov.costBases && Object.keys(ov.costBases).length > 0;
      const hasCash = ov.freeCash !== undefined && ov.freeCash !== null;
      return Boolean(hasPos || hasPrices || hasAvg || hasCost || hasCash);
    }

    function summarizeOverrides(ov) {
      if (!hasActiveOverrides(ov)) return [];
      const items = [];
      if (ov.positions) {
        Object.entries(ov.positions).forEach(([t, v]) => items.push(`${t} 股數: ${fmtNum(v, 0)}`));
      }
      if (ov.prices) {
        Object.entries(ov.prices).forEach(([t, v]) => items.push(`${t} 現價: £${fmtNum(v, v < 10 ? 4 : 2)}`));
      }
      if (ov.avgPrices) {
        Object.entries(ov.avgPrices).forEach(([t, v]) => items.push(`${t} 均價: £${fmtNum(v, 2)}`));
      }
      if (ov.freeCash !== undefined && ov.freeCash !== null) {
        items.push(`自由現金: ${fmtGBP(ov.freeCash)}`);
      }
      return items;
    }

        return !isNaN(parsed) && parsed >= 0 ? parsed : 300;

      const [manualOverrides, setManualOverrides] = useState(() => {
        try {

          const parsed = saved ? JSON.parse(saved) : null;

        } catch {

      });

      const [latestCloudData, setLatestCloudData] = useState(null);
      const [pendingCloudOverwrite, setPendingCloudOverwrite] = useState(null);

      const [activeTab, setActiveTab] = useState('summary'); // 'summary' | 'lqq3' | 'import' | 'settings'
      const [importText, setImportText] = useState('');
      const [importMsg, setImportMsg] = useState({ type: '', text: '' });
      const [lastUpdated, setLastUpdated] = useState(new Date().toLocaleTimeString('zh-HK'));
      const [editingTicker, setEditingTicker] = useState(null);
      const [isFetchingApi, setIsFetchingApi] = useState(false);
      const [fallbackNotes, setFallbackNotes] = useState([]);
      const [apiStatus, setApiStatus] = useState({
        type: 'idle',
        message: '已啟用 GitHub 全自動雲端同步引擎，打開網頁即自動讀取最新 IBUK 與 Yahoo Finance 倫敦 LSE 數據！',
        gbpUsdRate: 1.318
      });

      // 套用雲端 data.json（可選擇性保留手動覆寫欄位）
      const applyCloudData = (cloud, keepOverrides = null) => {
        if (!cloud || !cloud.marketData) return;
        const hasCloudPositions = cloud.ibkrPositions && Object.keys(cloud.ibkrPositions).length > 0;
        const zeroCostTickers = [];
        const ov = hasActiveOverrides(keepOverrides) ? keepOverrides : null;

        setHoldings(prev => prev.map(h => {
          const m = cloud.marketData[h.ticker];
          const p = hasCloudPositions ? cloud.ibkrPositions[h.ticker] : null;
          if (p && p.position > 0 && (!p.avgPrice || p.avgPrice <= 0)) {
            zeroCostTickers.push(h.ticker);
          }

          let nextPosition = (p && p.position !== undefined) ? p.position : h.position;
          let nextAvgPrice = (p && p.avgPrice > 0) ? p.avgPrice : h.avgPrice;
          let nextCostBasis = (p && p.costBasis > 0) ? p.costBasis : h.costBasis;
          let nextPrice = (m && m.priceGbp) ? m.priceGbp : h.price;

          if (ov) {
            if (ov.positions && ov.positions[h.ticker] !== undefined) {
              nextPosition = ov.positions[h.ticker];
              if (!ov.costBases || ov.costBases[h.ticker] === undefined) {
                nextCostBasis = nextPosition * nextAvgPrice;
              }
            }
            if (ov.avgPrices && ov.avgPrices[h.ticker] !== undefined) {
              nextAvgPrice = ov.avgPrices[h.ticker];
            }
            if (ov.costBases && ov.costBases[h.ticker] !== undefined) {
              nextCostBasis = ov.costBases[h.ticker];
            }
            if (ov.prices && ov.prices[h.ticker] !== undefined) {
              nextPrice = ov.prices[h.ticker];
            }
          }

          return {
            ...h,
            position: nextPosition,
            avgPrice: nextAvgPrice,
            costBasis: nextCostBasis,
            price: nextPrice,
            rsi2: (m && m.rsi2 !== undefined) ? m.rsi2 : h.rsi2,
            rsi14: (m && m.rsi14 !== undefined) ? m.rsi14 : h.rsi14,
            ma4: (m && m.ma4 !== undefined) ? m.ma4 : h.ma4,
            ma30: (m && m.ma30 !== undefined) ? m.ma30 : h.ma30
          };
        }));

        if (ov && ov.freeCash !== undefined && ov.freeCash !== null) {
          setFreeCash(ov.freeCash);
        } else if (cloud.freeCash !== null && cloud.freeCash !== undefined) {
          setFreeCash(cloud.freeCash);
        }

        if (cloud.updatedAt) {
          setLastUpdated(cloud.updatedAt);
        }

        // 整理防洗白 / 成本價沿用提示
        const notices = [];
        if (cloud.ibkrSyncStatus === 'CACHED_FALLBACK' || cloud.ibkrError) {
          const oldPosTime = cloud.ibkrPositionsUpdatedAt || '上一次成功同步';
          notices.push(
            `IBKR 持倉／現金本次同步未成功（${cloud.ibkrError || '伺服器逾時'}），目前持倉沿用 ${oldPosTime} 之舊快照頂替。`
          );
        }
        if (cloud.costBasisFallback && Array.isArray(cloud.costBasisFallback.tickers) && cloud.costBasisFallback.tickers.length > 0) {
          const fromTime = cloud.costBasisFallback.fromUpdatedAt || cloud.costBasisUpdatedAt || '上一次有效快照';
          notices.push(
            `最新股數、現金與 LSE 股價已於 ${cloud.updatedAt} 更新；但 IBKR Flex 回傳成本價為 0，以下標的之平均成本暫沿用 ${fromTime} 舊數據頂替：${cloud.costBasisFallback.tickers.join(', ')}`
          );
        } else if (zeroCostTickers.length > 0) {
          notices.push(
            `最新數據已於 ${cloud.updatedAt} 更新，但 IBKR 回傳以下標的成本價為 0，已保留瀏覽器原有成本價：${zeroCostTickers.join(', ')}`
          );

        setFallbackNotes(notices);

        const ibkrNote = cloud.ibkrError
          ? `Yahoo LSE 股價與 RSI/MA 已更新 (${cloud.updatedAt})，但 IBKR 持倉暫用舊快照`
          : `已自動載入雲端最新快照 (${cloud.updatedAt}) • IBUK 持倉 + Yahoo Finance 倫敦 LSE 股價及 Wilder RSI/MA`;
        setApiStatus({
          type: 'success',
          message: ibkrNote,
          gbpUsdRate: cloud.gbpUsdRate || 1.318
        });
      };

      // --- 啟動時自動讀取 GitHub Actions 生成的 data.json ---
      useEffect(() => {
        fetch('./data.json?t=' + Date.now(), { cache: 'no-store' })
          .then(res => {
            if (!res.ok) throw new Error('尚未生成 data.json');
            return res.json();
          })
          .then(cloud => {
            if (!cloud || !cloud.marketData) return;
            setLatestCloudData(cloud);

            let savedOverrides = null;
            try {
              const raw = localStorage.getItem('IBUK_MANUAL_OVERRIDES_V1');
              savedOverrides = raw ? JSON.parse(raw) : null;
            } catch {
              savedOverrides = null;
            }

            if (hasActiveOverrides(savedOverrides)) {
              const isNewerCloud = Boolean(cloud.updatedAt && cloud.updatedAt !== savedOverrides.baseCloudUpdatedAt);
              // 先安全保留用戶手動更改（其餘未改動的 RSI/MA 與標的照常更新）
              applyCloudData(cloud, savedOverrides);
              if (isNewerCloud) {
                setPendingCloudOverwrite(cloud);
              }
            } else {
              applyCloudData(cloud, null);
            }
          })
          .catch(() => {
            // 若在本地單獨開啟尚未連接 GitHub data.json，則靜默沿用本地儲存數據
          });
      }, []);

      useEffect(() => {
        localStorage.setItem('IBUK_QUANT_HOLDINGS_V2', JSON.stringify(holdings));
      }, [holdings]);

      useEffect(() => {
        localStorage.setItem('IBUK_FREE_CASH_V2', freeCash.toString());
      }, [freeCash]);

      useEffect(() => {
        localStorage.setItem('IBUK_LQQ3_CONFIG_V2', JSON.stringify(lqq3Config));
      }, [lqq3Config]);

      useEffect(() => {
        localStorage.setItem('IBUK_REBALANCE_THRESHOLD_V2', String(rebalanceThreshold));
      }, [rebalanceThreshold]);

      useEffect(() => {
        if (hasActiveOverrides(manualOverrides)) {
          localStorage.setItem('IBUK_MANUAL_OVERRIDES_V1', JSON.stringify(manualOverrides));
        } else {
          localStorage.removeItem('IBUK_MANUAL_OVERRIDES_V1');
        }
      }, [manualOverrides]);

      // 1. 各持倉市值與盈虧
      const calculatedHoldings = useMemo(() => {
        return holdings.map(h => {
          const mktVal = h.position * h.price;
          const costVal = h.costBasis > 0 ? h.costBasis : (h.position * h.avgPrice);
          const pnl = mktVal - costVal;
          const pnlPct = costVal > 0 ? (pnl / costVal) * 100 : 0;
          return { ...h, mktVal, costVal, pnl, pnlPct };
        });
      }, [holdings]);

      // 2. 總持倉市值
      const totalPositionsVal = useMemo(() => {
        return calculatedHoldings.reduce((sum, item) => sum + item.mktVal, 0);
      }, [calculatedHoldings]);

      // 3. 總組合資產總值 Total NAV
      const totalNAV = useMemo(() => {
        return totalPositionsVal + freeCash;
      }, [totalPositionsVal, freeCash]);

      // 4. LQQ3 預留子彈計算
      const lqq3ReservedCash = useMemo(() => {
        return lqq3Config.tranches
          .filter(t => t.status === 'PENDING')
          .reduce((sum, t) => sum + (t.shares * t.buyPriceGbp), 0);
      }, [lqq3Config]);

      // 5. 真實 CSH2 防守佔比
      const csh2Item = calculatedHoldings.find(h => h.ticker === 'CSH2');
      const csh2Value = csh2Item ? csh2Item.mktVal : 0;
      const trueCsh2Denominator = Math.max(1, totalNAV - lqq3ReservedCash);
      const trueCsh2Pct = (csh2Value / trueCsh2Denominator) * 100;
      const isCsh2Safe = trueCsh2Pct >= 20.0;

      // 6. 總流動性儲備
      const totalLiquidity = csh2Value + freeCash;
      const totalLiquidityPct = totalNAV > 0 ? (totalLiquidity / totalNAV) * 100 : 0;

      // 7. 未實現總盈虧
      const totalCostBasis = useMemo(() => {
        return calculatedHoldings.reduce((sum, item) => sum + item.costVal, 0);
      }, [calculatedHoldings]);
      const totalUnrealizedPnL = totalPositionsVal - totalCostBasis;
      const totalPnLPct = totalCostBasis > 0 ? (totalUnrealizedPnL / totalCostBasis) * 100 : 0;

      // 8. 主矩陣表格數據增強
      const summaryTableData = useMemo(() => {
        return calculatedHoldings.map(item => {
          const currentWeight = totalNAV > 0 ? (item.mktVal / totalNAV) * 100 : 0;
          const targetValue = totalNAV * (item.targetPct / 100);
          const difference = item.mktVal - targetValue;

          let signal = { code: 'HOLD', label: '⏸️ 按兵不動', color: 'bg-slate-800 text-slate-300' };

          if (item.ticker === 'LQQ3') {
            const daysHeld = calcTradingDays(lqq3Config.buyDate);
            const vnrtItem = calculatedHoldings.find(h => h.ticker === 'VNRT');
            const isVnrtOverbought = vnrtItem && vnrtItem.rsi2 > 85;
            const stopPriceGbp = lqq3Config.hardStopPriceGbp ?? 162.0;
            const timeStopDays = lqq3Config.targetHoldDays || 15;

            if (item.position <= 0) {
              signal = { code: 'STANDBY', label: '⏳ 空倉待命 (GTC 網格掛單)', color: 'bg-slate-800 text-slate-300 border border-slate-700' };
            } else if (item.price < stopPriceGbp) {
              signal = {
                code: 'PRICE_STOP',
                label: `🚨 觸發價格止損 (<£${fmtNum(stopPriceGbp, 2)} / ${Math.round(stopPriceGbp * 100).toLocaleString()}p)`,
                color: 'bg-rose-600 text-white font-bold animate-pulse'
              };
            } else if (item.pnlPct >= lqq3Config.takeProfitPct || isVnrtOverbought) {
              const reason = isVnrtOverbought ? 'VNRT RSI>85' : `+${fmtNum(item.pnlPct, 1)}%`;
              signal = {
                code: 'TAKE_PROFIT',
                label: `🎯 觸發止賺 (${reason}) 沽半倉→移平手→撥入CSH2`,
                color: 'bg-emerald-600 text-white font-bold animate-pulse'
              };
            } else if (daysHeld >= timeStopDays) {
              signal = {
                code: 'TIME_STOP',
                label: `⚠️ 時間止損 (${daysHeld}/${timeStopDays}交易日・建議減半倉)`,
                color: 'bg-amber-600 text-white font-bold'
              };
            } else {
              signal = {
                code: 'HOLD_ATTACK',
                label: `🚀 戰術持倉中 (第 ${daysHeld}/${timeStopDays} 交易日)`,
                color: 'bg-indigo-900/80 text-indigo-200 border border-indigo-500/50'
              };
            }
          } else if (item.ticker === 'CRUD') {
            signal = { code: 'CLOSED', label: '❌ 已退場歸零', color: 'bg-slate-900 text-slate-500' };
          } else if (item.ticker === 'CSH2') {
            if (!isCsh2Safe) {
              const estShares = Math.ceil((0.20 * trueCsh2Denominator - csh2Value) / item.price);
              signal = {
                code: 'DEFEND_CSH2',
                label: `🚨 補充防線 +${estShares} 股`,
                color: 'bg-rose-600 text-white font-bold animate-pulse'
              };
            }
          } else {
            const absDiff = Math.abs(difference);
            const isUnderweight = difference < 0;
            const isOverweight = difference > 0;

            if (isUnderweight) {
              if (item.rsi2 < 15 && absDiff >= rebalanceThreshold) {
                const estShares = Math.max(1, Math.round(absDiff / item.price));
                signal = {
                  code: 'BUY',
                  label: `🟢 建議買入 ~${estShares} 股`,
                  color: 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-bold'
                };
              } else if (item.rsi2 < 15 && absDiff < rebalanceThreshold) {
                signal = {
                  code: 'WATCH_BUY',
                  label: `👀 超賣觀察 (缺口<£${rebalanceThreshold})`,
                  color: 'bg-cyan-950/80 text-cyan-300 border border-cyan-700/50'
                };
              }
            } else if (isOverweight) {
              if (item.rsi2 > 85) {
                const estShares = Math.max(1, Math.round(absDiff / item.price));
                signal = {
                  code: 'TAKE_PROFIT',
                  label: `🔴 超買止賺 ~${estShares} 股`,
                  color: 'bg-rose-500/20 text-rose-300 border border-rose-500/40 font-bold'
                };
              }
            }
          }

          return {
            ...item,
            currentWeight,
            targetValue,
            difference,
            signal
          };
        });
      }, [calculatedHoldings, totalNAV, rebalanceThreshold, lqq3Config, isCsh2Safe, trueCsh2Denominator, csh2Value]);

      const lqq3Item = useMemo(() => {
        return summaryTableData.find(h => h.ticker === 'LQQ3');
      }, [summaryTableData]);

      const lqq3DaysHeld = useMemo(() => {
        return calcTradingDays(lqq3Config.buyDate);
      }, [lqq3Config.buyDate]);

      const handleCellEdit = (ticker, field, rawVal) => {
        const val = parseFloat(rawVal);
        if (isNaN(val) || val < 0) return;
        const currentItem = holdings.find(h => h.ticker === ticker);
        if (currentItem && Number(currentItem[field]) === val) return;

        setHoldings(prev => prev.map(h => {
          if (h.ticker !== ticker) return h;
          const updated = { ...h, [field]: val };
          if (field === 'position') {
            updated.costBasis = val * updated.avgPrice;
          }
          return updated;
        }));

        const now = new Date();
        const ts = formatLocalTimestamp(now);
        setManualOverrides(prev => {
          const base = prev ? { ...prev } : { positions: {}, prices: {}, avgPrices: {}, costBases: {} };
          const key = field === 'position' ? 'positions' : field === 'price' ? 'prices' : null;
          if (key) {
            base[key] = { ...(base[key] || {}), [ticker]: val };
          }
          base.updatedAt = ts;
          base.updatedAtIso = now.toISOString();
          base.baseCloudUpdatedAt = latestCloudData?.updatedAt || base.baseCloudUpdatedAt || null;
          return base;
        });
        setLastUpdated(`手動 ${ts.slice(11, 16)}`);
      };

      const handleFreeCashChange = (rawVal) => {
        const parsed = parseFloat(rawVal);
        const val = isNaN(parsed) || parsed < 0 ? 0 : parsed;
        setFreeCash(val);
        const now = new Date();
        const ts = formatLocalTimestamp(now);
        setManualOverrides(prev => ({
          ...(prev || { positions: {}, prices: {}, avgPrices: {}, costBases: {} }),
          freeCash: val,
          updatedAt: ts,
          updatedAtIso: now.toISOString(),
          baseCloudUpdatedAt: latestCloudData?.updatedAt || prev?.baseCloudUpdatedAt || null
        }));
      };

      // 答「是」：覆寫手動更改為最新下載的 data.json
      const handleAcceptCloudOverwrite = () => {
        const cloud = pendingCloudOverwrite || latestCloudData;
        setManualOverrides(null);
        setPendingCloudOverwrite(null);
        if (cloud) {
          applyCloudData(cloud, null);
        }
      };

      // 答「否」：保留手動更改，並把基準版本對齊到本次 data.json（直到下一次 data.json 再更新才再詢問）
      const handleKeepManualOverrides = () => {
        if (pendingCloudOverwrite) {
          setManualOverrides(prev => prev ? {
            ...prev,
            baseCloudUpdatedAt: pendingCloudOverwrite.updatedAt || prev.baseCloudUpdatedAt
          } : prev);
        }
        setPendingCloudOverwrite(null);
      };

      // 主動放棄手動修改，還原雲端 data.json
      const handleDiscardManualOverrides = () => {
        setManualOverrides(null);
        setPendingCloudOverwrite(null);
        if (latestCloudData) {
          applyCloudData(latestCloudData, null);
        }
      };

      // Yahoo Finance LSE (.L) 抓數並重算全組合 Wilder RSI(2), RSI(14), MA4, MA30
      const fetchLiveMarketData = async () => {
        if (isFetchingApi) return;
        setIsFetchingApi(true);
        setApiStatus(prev => ({
          ...prev,
          type: 'loading',
          message: '正在透過 Yahoo Finance 抓取倫敦交易所 (LSE .L) 3 個月日線並重算 Wilder RSI/MA...'
        }));

        try {
          let gbpUsd = apiStatus.gbpUsdRate || 1.318;
          try {
            const fxChart = await fetchYahooChartWithFallback('GBPUSD=X');
            if (fxChart.closes.length > 0) {
              gbpUsd = fxChart.closes[fxChart.closes.length - 1];
            }
          } catch (fxErr) {
            console.warn('GBPUSD 匯率抓數失敗，沿用預設匯率:', fxErr);
          }

          const tickers = Object.keys(LSE_TICKER_META);
          const resultsMap = {};
          let successCount = 0;

          await Promise.all(
            tickers.map(async (ticker) => {
              const meta = LSE_TICKER_META[ticker];
              try {
                const chart = await fetchYahooChartWithFallback(meta.yahoo);
                const indicators = computeExcelIndicators(chart.closes);
                if (indicators) {
                  resultsMap[ticker] = { meta, indicators };
                  successCount++;
                }
              } catch (err) {
                console.warn(`${meta.yahoo} 抓數失敗:`, err);
              }
            })
          );

          if (successCount === 0) {
            throw new Error(
              '瀏覽器代理節點暫時受限，建議依賴 GitHub Actions 自動同步之雲端 data.json（每交易日 17:30 / 21:30 UTC 自動更新）'
            );
          }

          setHoldings(prev => prev.map(h => {
            const fetched = resultsMap[h.ticker];
            if (!fetched) return h;

            const { meta, indicators } = fetched;
            let priceGbp = indicators.latestRawClose;
            let ma4Gbp = indicators.ma4;
            let ma30Gbp = indicators.ma30;
            if (meta.isPence) {
              priceGbp = priceGbp / 100;
              ma4Gbp = ma4Gbp / 100;
              ma30Gbp = ma30Gbp / 100;
            }
            if (meta.isUsd) {
              priceGbp = priceGbp / gbpUsd;
              ma4Gbp = ma4Gbp / gbpUsd;
              ma30Gbp = ma30Gbp / gbpUsd;
            }

            return {
              ...h,
              price: Number(priceGbp.toFixed(4)),
              rsi2: indicators.rsi2,
              rsi14: indicators.rsi14,
              ma4: Number(ma4Gbp.toFixed(2)),
              ma30: Number(ma30Gbp.toFixed(2))
            };
          }));

          setManualOverrides(prev => {
            if (!prev || !prev.prices) return prev;
            const nextPrices = { ...prev.prices };
            Object.keys(resultsMap).forEach(t => { delete nextPrices[t]; });
            const next = { ...prev, prices: nextPrices };
            return hasActiveOverrides(next) ? next : null;
          });

          const nowStr = new Date().toLocaleTimeString('zh-HK');
          setLastUpdated(nowStr);
          setApiStatus({
            type: 'success',
            message: `已透過 Yahoo Finance 同步 ${successCount}/${tickers.length} 隻 LSE (.L) ETF 真實行情並重算 Wilder RSI/MA (GBP/USD: ${gbpUsd.toFixed(4)})`,
            gbpUsdRate: gbpUsd
          });
        } catch (err) {
          setApiStatus(prev => ({
            ...prev,
            type: 'error',
            message: `Yahoo Finance 連線受阻：${err.message}`
          }));
        } finally {
          setIsFetchingApi(false);
        }
      };

      // 匯入解析 (支援 IBKR Flex CSV 或自訂剪貼簿表格)
      const handleParseCSV = () => {
        if (!importText.trim()) {
          setImportMsg({ type: 'error', text: '請先貼上 CSV 內容或剪貼簿表格！' });
          return;
        }
        try {
          const lines = importText.trim().split('\n');
          let updatedCount = 0;
          const newHoldings = holdings.map(h => ({ ...h }));
          let detectedCash = null;
          const csvPosOv = {};
          const csvPriceOv = {};
          const csvAvgOv = {};
          const csvCostOv = {};

          lines.forEach(line => {
            const cols = line.split(/[,\t;]/).map(c => c.replace(/^"|"$/g, '').trim());
            if (cols.length >= 2) {
              let rawSymbol = cols[0].toUpperCase();
              const cleanSymbol = rawSymbol.replace(/L$/, '');

              if (cleanSymbol === 'GBP' || cleanSymbol === 'CASH') {
                const numVal = parseFloat(cols[cols.length - 1]) || parseFloat(cols[1]);
                if (!isNaN(numVal)) detectedCash = numVal;
              } else {
                const targetIdx = newHoldings.findIndex(h => h.ticker === cleanSymbol);
                if (targetIdx !== -1) {
                  const pos = parseFloat(cols[1]);
                  const costOrAvg = parseFloat(cols[2]);
                  const mktPrice = parseFloat(cols[3]);

                  if (!isNaN(pos)) {
                    newHoldings[targetIdx].position = pos;
                    csvPosOv[cleanSymbol] = pos;
                    if (!isNaN(costOrAvg) && costOrAvg > 0) {
                      if (pos > 0 && costOrAvg > pos * 2) {
                        newHoldings[targetIdx].costBasis = costOrAvg;
                        newHoldings[targetIdx].avgPrice = costOrAvg / pos;
                      } else {
                        newHoldings[targetIdx].avgPrice = costOrAvg;
                        newHoldings[targetIdx].costBasis = pos * costOrAvg;
                      }
                      csvAvgOv[cleanSymbol] = newHoldings[targetIdx].avgPrice;
                      csvCostOv[cleanSymbol] = newHoldings[targetIdx].costBasis;
                    }
                    if (!isNaN(mktPrice) && mktPrice > 0) {
                      newHoldings[targetIdx].price = mktPrice;
                      csvPriceOv[cleanSymbol] = mktPrice;
                    }
                    updatedCount++;
                  }
                }
              }
            }
          });

          if (updatedCount > 0 || detectedCash !== null) {
            const now = new Date();
            const ts = formatLocalTimestamp(now);
            setHoldings(newHoldings);
            if (detectedCash !== null) setFreeCash(detectedCash);
            setManualOverrides(prev => ({
              ...(prev || { positions: {}, prices: {}, avgPrices: {}, costBases: {} }),
              positions: { ...(prev?.positions || {}), ...csvPosOv },
              prices: { ...(prev?.prices || {}), ...csvPriceOv },
              avgPrices: { ...(prev?.avgPrices || {}), ...csvAvgOv },
              costBases: { ...(prev?.costBases || {}), ...csvCostOv },
              ...(detectedCash !== null ? { freeCash: detectedCash } : {}),
              updatedAt: ts,
              updatedAtIso: now.toISOString(),
              baseCloudUpdatedAt: latestCloudData?.updatedAt || prev?.baseCloudUpdatedAt || null
            }));
            setLastUpdated(`手動 ${ts.slice(11, 16)}`);
            setImportMsg({
              type: 'success',
              text: `成功解析！已更新 ${updatedCount} 項持倉紀錄${detectedCash !== null ? `，並同步現金餘額為 ${fmtGBP(detectedCash)}` : ''}（已記錄手動時間戳）。`
            });
            setTimeout(() => setActiveTab('summary'), 1200);
          } else {
            setImportMsg({ type: 'error', text: '未能識別出標準代號 (CSH2, VNRT, LQQ3 等)，請確認格式為「代號, 股數, 均價, 現價」。' });
          }
        } catch (err) {
          setImportMsg({ type: 'error', text: '解析發生錯誤：' + err.message });
        }
      };

      const exportJSON = () => {
        const payload = {
          exportDate: new Date().toISOString(),
          freeCash,
          rebalanceThreshold,
          holdings,
          lqq3Config,
          manualOverrides
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `IBUK_Portfolio_Backup_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const importJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.holdings) setHoldings(parsed.holdings);
            if (parsed.freeCash !== undefined) setFreeCash(parsed.freeCash);
            if (parsed.rebalanceThreshold !== undefined) setRebalanceThreshold(Number(parsed.rebalanceThreshold) || 300);
            if (parsed.lqq3Config) setLqq3Config(parsed.lqq3Config);
            if (parsed.manualOverrides !== undefined) {
              setManualOverrides(hasActiveOverrides(parsed.manualOverrides) ? parsed.manualOverrides : null);
            }
            setImportMsg({ type: 'success', text: 'JSON 備份檔恢復成功！所有數據已跨裝置同步。' });
            setLastUpdated(new Date().toLocaleTimeString('zh-HK'));
          } catch (err) {
            setImportMsg({ type: 'error', text: '無效的 JSON 檔案格式。' });
          }
        };
        reader.readAsText(file);
      };

      const resetDefault = () => {
        setHoldings(INITIAL_HOLDINGS);
        setFreeCash(1767.88);
        setRebalanceThreshold(300);
        setLqq3Config(INITIAL_LQQ3_PARAMS);
        setManualOverrides(null);
        setPendingCloudOverwrite(null);
        setImportMsg({ type: 'success', text: '已重置為預設基準數據並清除手動修改紀錄！' });
      };

      const updateTrancheStatus = (id, newStatus) => {
        setLqq3Config(prev => ({
          ...prev,
          tranches: prev.tranches.map(t => t.id === id ? { ...t, status: newStatus } : t)
        }));
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
          {/* 頂部導航欄 */}
          <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-6 border-b border-slate-800">
            <div>
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center shadow-lg shadow-emerald-950">
                  <i className="fas fa-chart-line text-white text-lg"></i>
                </div>
                <div>
                  <h1 className="text-xl sm:text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                    IBUK 量化配置戰情室
                    <span className="text-xs font-medium px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                      ISA 跨平台 Web App
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400 mt-0.5">
                    全天候自動導航系統 • 告別 M365 限制 • 數據自動儲存於本機瀏覽器
                  </p>
                </div>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2 sm:gap-3 w-full md:w-auto">
              <div className="text-xs text-slate-400 bg-slate-900 px-3 py-2 rounded-lg border border-slate-800 flex items-center gap-2">
                <span className={`w-2 h-2 rounded-full ${apiStatus.type === 'error' ? 'bg-rose-500' : isFetchingApi ? 'bg-amber-400 animate-ping' : 'bg-emerald-500 animate-pulse'}`}></span>

                             `${row.difference >= 0 ? '+' : ''}${fmtGBP(row.difference)}`}
                          </td>

                          <td className="py-3.5 px-3 text-center mono text-xs whitespace-nowrap">
                            <span className={`px-2 py-0.5 rounded font-bold ${
                              isRsiOversold ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' :
                              isRsiOverbought ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40' :
                              'text-slate-300'
                            }`}>
                              {fmtNum(row.rsi2, 1)}
                            </span>
                            <span className="text-slate-500 ml-1">/ {fmtNum(row.rsi14, 0)}</span>
                          </td>

                          <td className="py-3.5 px-3 text-right mono text-[11px] text-slate-400 whitespace-nowrap">
                            <div>{fmtNum(row.ma4, 2)}</div>
                            <div className="text-slate-500">{fmtNum(row.ma30, 2)}</div>
                          </td>

                          <td className="py-3.5 px-4 pr-6 whitespace-nowrap">
                            <span className={`inline-block px-2.5 py-1 rounded-lg text-xs whitespace-nowrap ${row.signal.color}`}>
                              {row.signal.label}
                            </span>
                          </td>
                        </tr>
                      );
                    })}

                    {/* 自由現金總結行 */}
                    <tr className="bg-slate-950/80 font-medium border-t-2 border-slate-800">
                      <td className="py-3.5 px-3 sm:px-4 sticky left-0 z-10 bg-slate-950 shadow-[2px_0_6px_-2px_rgba(0,0,0,0.6)] max-w-[140px] sm:max-w-none">
                        <div className="flex items-center gap-2">
                          <span className="font-bold mono px-2 py-0.5 rounded text-xs bg-cyan-500/20 text-cyan-300 shrink-0">CASH</span>
                          <div className="min-w-0">
                            <div className="text-slate-200 text-xs sm:text-sm truncate sm:whitespace-normal">IBUK 帳戶自由現金 (Free Cash GBP)</div>
                            <div className="text-[11px] text-slate-500 hidden sm:block">預留覆蓋 LQQ3 第三注 £1,701.00，剩餘約 {fmtGBP(freeCash - lqq3ReservedCash)} 可供低吸</div>
                          </div>
                        </div>
                      </td>
                      <td colSpan="3" className="py-3.5 px-3 text-right text-xs text-slate-400 whitespace-nowrap">直接於頂部 KPI 卡可編輯</td>
                      <td className="py-3.5 px-3 text-right mono font-bold text-cyan-400 whitespace-nowrap">{fmtGBP(freeCash)}</td>
                      <td className="py-3.5 px-3 text-right mono text-xs text-cyan-300 whitespace-nowrap">
                        {fmtNum((freeCash / Math.max(1, totalNAV)) * 100, 2)}%
                      </td>
                      <td colSpan="4" className="py-3.5 px-4 text-xs text-slate-400 whitespace-nowrap">
                        總資產合計 Total NAV: <span className="text-white font-bold mono ml-1">{fmtGBP(totalNAV)}</span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* =========================================================
              分頁 2: LQQ3 獨立衛星戰術艙
             ========================================================= */}
          {activeTab === 'lqq3' && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="lg:col-span-1 bg-slate-900 border border-indigo-500/30 rounded-2xl p-5 shadow-xl space-y-5">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white flex items-center gap-2">
                    <i className="fas fa-stopwatch text-indigo-400"></i> 槓桿戰術參數與時間止損
                  </h3>
                  <span className="text-xs bg-indigo-950 text-indigo-300 px-2 py-0.5 rounded border border-indigo-500/30">
                    3x 每日槓桿風控
                  </span>
                </div>

                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-1.5">首筆進場成交日期 (Day 0)</label>
                  <input
                    type="date"
                    value={lqq3Config.buyDate}
                    onChange={(e) => setLqq3Config({ ...lqq3Config, buyDate: e.target.value })}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white mono focus:border-indigo-500 focus:outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-1.5">時間止損上限 (Time-Stop 交易日・v2.0 預設 15 日)</label>
                  <div className="grid grid-cols-4 gap-2">
                    {[15, 20, 30, 45].map(days => (
                      <button
                        key={days}
                        onClick={() => setLqq3Config({ ...lqq3Config, targetHoldDays: days })}
                        className={`py-2 rounded-xl text-xs font-bold mono transition border ${
                          lqq3Config.targetHoldDays === days
                            ? 'bg-indigo-600 text-white border-indigo-400'
                            : 'bg-slate-950 text-slate-400 border-slate-800 hover:text-white'
                        }`}
                      >
                        {days} 日
                      </button>
                    ))}
                  </div>
                  <p className="text-[11px] text-slate-500 mt-1.5">
                    從第一注成交日起自動扣除星期六、日計算交易日。目前已持有 <span className={`font-bold ${lqq3DaysHeld >= (lqq3Config.targetHoldDays || 15) ? 'text-amber-400' : 'text-indigo-300'}`}>{lqq3DaysHeld}</span> / {lqq3Config.targetHoldDays || 15} 個交易日
                    {lqq3DaysHeld >= (lqq3Config.targetHoldDays || 15) && <span className="text-amber-400 font-semibold">（⚠️ 達時間止損，建議減半倉避開 3x 損耗）</span>}。
                  </p>
                </div>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">目標止賺幅度 (%)</label>
                    <input
                      type="number"
                      step="0.5"
                      value={lqq3Config.takeProfitPct}
                      onChange={(e) => setLqq3Config({ ...lqq3Config, takeProfitPct: Number(e.target.value) })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-emerald-400 font-bold mono"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">價格止損底線 (£)</label>
                    <input
                      type="number"
                      step="1"
                      value={lqq3Config.hardStopPriceGbp ?? 162}
                      onChange={(e) => setLqq3Config({ ...lqq3Config, hardStopPriceGbp: Number(e.target.value) })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-rose-400 font-bold mono"
                    />
                  </div>
                </div>

                <div className="bg-slate-950 rounded-xl p-4 border border-slate-800 space-y-2 text-xs">
                  <div className="flex justify-between gap-2">
                    <span className="text-slate-400">現有 LQQ3 持倉：</span>
                    <span className="text-white font-bold mono whitespace-nowrap">{lqq3Item ? lqq3Item.position : 0} / 21 股 @ {lqq3Item ? fmtGBP(lqq3Item.avgPrice) : '£0'}</span>
                  </div>
                  <div className="flex justify-between gap-2">
                    <span className="text-slate-400">現價 / 止賺目標 (+{lqq3Config.takeProfitPct}%)：</span>
                    <span className="text-emerald-400 font-bold mono whitespace-nowrap">
                      {lqq3Item ? fmtGBP(lqq3Item.price) : '£0'} / {lqq3Item && lqq3Item.avgPrice > 0 ? fmtGBP(lqq3Item.avgPrice * (1 + lqq3Config.takeProfitPct / 100)) : '£0'}
                    </span>
                  </div>
                  <div className="flex justify-between gap-2">
                    <span className="text-slate-400">價格止損底線：</span>
                    <span className={`font-bold mono whitespace-nowrap ${lqq3Item && lqq3Item.price < (lqq3Config.hardStopPriceGbp ?? 162) ? 'text-rose-400 animate-pulse' : 'text-rose-400'}`}>
                      {fmtGBP(lqq3Config.hardStopPriceGbp ?? 162)} ({Math.round((lqq3Config.hardStopPriceGbp ?? 162) * 100).toLocaleString()} GBp)
                    </span>
                  </div>
                  <div className="pt-2 border-t border-slate-800/80 text-[11px] text-slate-400 leading-relaxed">
                    <div>• <span className="text-emerald-300">止賺</span>：回報 ≥ +{lqq3Config.takeProfitPct}% 或 VNRT 日線 RSI(2) &gt; 85 → 沽半倉、移止損至平手、利潤撥入 CSH2</div>
                    <div>• <span className="text-rose-300">紀律</span>：上限 21 股，嚴禁動用 CSH2 20% 置業防線資金補第四注</div>
                  </div>
                </div>
              </div>

              <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                <div>
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-800 pb-3 mb-4">
                    <div>
                      <h3 className="font-bold text-white flex items-center gap-2">
                        <i className="fas fa-chess-knight text-amber-400"></i> 三段式網格掛單與子彈管理 (3-Tranche Grid)
                      </h3>
                      <p className="text-xs text-slate-400 mt-0.5">
                        將 GTC 限價單狀態切換為「已成交」或「掛單中」，頂部 20% CSH2 防線公式會自動扣除未成交的預留子彈。
                      </p>
                    </div>
                  </div>

                  <div className="space-y-3">
                    {lqq3Config.tranches.map((tranche) => {
                      const trancheCost = tranche.shares * tranche.buyPriceGbp;
                      const isFilled = tranche.status === 'FILLED';
                      return (
                        <div
                          key={tranche.id}
                          className={`p-4 rounded-xl border transition flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 ${
                            isFilled
                              ? 'bg-emerald-950/20 border-emerald-500/40'
                              : 'bg-slate-950/80 border-slate-800'
                          }`}
                        >
                          <div className="space-y-1">
                            <div className="flex items-center gap-2">
                              <span className="font-bold text-white text-sm">{tranche.label}</span>
                              <span className={`text-[11px] px-2 py-0.5 rounded-full font-bold ${
                                isFilled ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'
                              }`}>
                                {isFilled ? '✅ 已成交 (FILLED)' : '⏳ GTC 掛單待命 (PENDING)'}
                              </span>
                            </div>
                            <p className="text-xs text-slate-400">{tranche.note}</p>
                          </div>

                          <div className="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end">
                            <div className="text-right mono">
                              <div className="text-sm font-bold text-white">{tranche.shares} 股 @ {fmtGBP(tranche.buyPriceGbp)}</div>
                              <div className="text-xs text-slate-400">資金: {fmtGBP(trancheCost)}</div>
                            </div>

                            <button
                              onClick={() => updateTrancheStatus(tranche.id, isFilled ? 'PENDING' : 'FILLED')}
                              className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition ${
                                isFilled
                                  ? 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'
                                  : 'bg-emerald-600 text-white border-emerald-500 hover:bg-emerald-500'
                              }`}
                            >
                              {isFilled ? '設為掛單中' : '標記已成交'}
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="mt-6 bg-indigo-950/40 border border-indigo-500/30 rounded-xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                  <div className="text-xs space-y-1">
                    <div className="text-indigo-200 font-bold">子彈覆蓋率校驗 (Ammo Coverage Check)</div>
                    <div className="text-slate-400">
                      未成交掛單所需預留現金：<span className="text-amber-300 mono font-bold">{fmtGBP(lqq3ReservedCash)}</span> ｜
                      帳戶自由現金：<span className="text-cyan-300 mono font-bold">{fmtGBP(freeCash)}</span>
                    </div>
                  </div>
                  <div>
                    {freeCash >= lqq3ReservedCash ? (
                      <span className="px-3 py-1.5 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-xs font-bold">
                        ✅ 資金充裕 (尚餘 {fmtGBP(freeCash - lqq3ReservedCash)} 可供 Core 買入)
                      </span>
                    ) : (
                      <span className="px-3 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-bold">
                        ⚠️ 自由現金不足，差額 {fmtGBP(lqq3ReservedCash - freeCash)}
                      </span>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* =========================================================
              分頁 3: IBKR 數據匯入與跨裝置同步
             ========================================================= */}
          {activeTab === 'import' && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                <div>
                  <h3 className="font-bold text-white flex items-center gap-2">
                    <i className="fas fa-paste text-cyan-400"></i> 貼上 IBKR CSV / 剪貼簿快速更新
                  </h3>
                  <p className="text-xs text-slate-400 mt-1">
                    取代舊有 M365 Power Query！支援直接貼上 IBKR 匯出資料（自動清理 <code className="text-cyan-300">CSH2l</code>、<code className="text-cyan-300">VNRTl</code> 尾綴），格式：<code className="text-slate-300">代號, 股數, 均價, 最新價</code>。
                  </p>
                </div>

                <textarea
                  rows="7"
                  value={importText}
                  onChange={(e) => setImportText(e.target.value)}
                  placeholder={`範例格式 (可直接貼上)：\nCSH2l, 4800, 4.95, 5.047\nVNRTl, 225, 126.62, 136.09\nLQQ3l, 12, 213.18, 223.38\nGBP, 1989.15`}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs mono text-slate-200 focus:border-cyan-500 focus:outline-none"
                ></textarea>

                {importMsg.text && (
                  <div className={`p-3 rounded-xl text-xs font-medium ${
                    importMsg.type === 'success'
                      ? 'bg-emerald-950/80 text-emerald-300 border border-emerald-500/40'
                      : 'bg-rose-950/80 text-rose-300 border border-rose-500/40'
                  }`}>
                    {importMsg.text}
                  </div>
                )}

                <div className="flex flex-wrap gap-3">
                  <button
                    onClick={handleParseCSV}
                    className="bg-cyan-600 hover:bg-cyan-500 text-white font-medium text-xs px-4 py-2.5 rounded-xl transition shadow-lg shadow-cyan-950 flex items-center gap-2"
                  >
                    <i className="fas fa-magic"></i> 解析並更新持倉表
                  </button>
                  <button
                    onClick={() => setImportText('')}
                    className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-4 py-2.5 rounded-xl transition"
                  >
                    清空輸入框
                  </button>
                </div>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between space-y-6">
                <div className="space-y-4">
                  <div>
                    <h3 className="font-bold text-white flex items-center gap-2">
                      <i className="fas fa-cloud-upload-alt text-emerald-400"></i> 跨電腦 / 手機無縫同步備份
                    </h3>
                    <p className="text-xs text-slate-400 mt-1">
                      本網頁 App 完全無需安裝 Microsoft 365。在公司電腦更新數據後，下載 JSON 備份檔傳送至手機或家中 Mac/PC 匯入即可 100% 還原。
                    </p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                      <div className="text-xs font-bold text-white">1. 匯出目前最新快照</div>
                      <p className="text-[11px] text-slate-400">將目前所有持倉、自由現金、LQQ3 網格進度打包下載。</p>
                      <button
                        onClick={exportJSON}
                        className="w-full mt-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium py-2 rounded-lg transition"
                      >
                        <i className="fas fa-file-export mr-1"></i> 下載 JSON 備份檔
                      </button>
                    </div>

                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                      <div className="text-xs font-bold text-white">2. 從其他裝置匯入快照</div>
                      <p className="text-[11px] text-slate-400">選擇之前下載的 JSON 備份檔，即時同步全盤狀態。</p>
                      <label className="w-full mt-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 text-xs font-medium py-2 rounded-lg transition flex items-center justify-center cursor-pointer">
                        <i className="fas fa-folder-open mr-1"></i> 選擇 JSON 檔案匯入
                        <input type="file" accept=".json" onChange={importJSON} className="hidden" />
                      </label>
                    </div>
                  </div>
                </div>

                <div className="pt-4 border-t border-slate-800 flex justify-between items-center">
                  <span className="text-xs text-slate-500">想恢復為系統預設的 11月23日 基準數據？</span>
                  <button
                    onClick={resetDefault}
                    className="text-xs text-rose-400 hover:text-rose-300 underline"
                  >
                    重置為預設快照
                  </button>
                </div>
              </div>
            </div>
          )}

          <footer className="mt-10 pt-6 border-t border-slate-800/80 text-center text-xs text-slate-500">
            <p>IBUK 量化配置戰情室 • 專為 ISA 免稅帳戶設計 • 數據儲存於本地瀏覽器 LocalStorage</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PortfolioDashboard />);
  </script>
</body>
</html>
