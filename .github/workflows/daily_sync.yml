name: Daily IBUK & LSE Portfolio Sync

on:

每個交易日倫敦收市後自動執行 (UTC 17:30 & 21:30，即倫敦時間收市及美股收市後)

schedule:
- cron: '30 17 * * 1-5'
- cron: '30 21 * * 1-5'

支援隨時在 GitHub 網頁點 "Run workflow" 手動一鍵觸發

workflow_dispatch:

permissions:
contents: write

jobs:
sync-data:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Run IBUK & Yahoo LSE Sync Script
    env:
      IBKR_TOKEN: ${{ secrets.IBKR_TOKEN }}
      IBKR_QUERY_ID: ${{ secrets.IBKR_QUERY_ID }}
    run: python scripts/sync_portfolio.py

  - name: Commit and push updated data.json
    run: |
      git config --local user.email "github-actions[bot]@users.noreply.github.com"
      git config --local user.name "github-actions[bot]"
      git add data.json
      git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync IBUK & LSE portfolio data" && git push)
